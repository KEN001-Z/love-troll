<script>
try {
  const [destinationPath, startedAt] = (sessionStorage.getItem('vybe-transition-destination') || '').split('|');
  const age = Date.now() - Number(startedAt);
  const navigation = performance.getEntriesByType('navigation')[0];
  if ((destinationPath === location.pathname && Number.isFinite(age) && age >= 0 && age < 10000) ||
      navigation?.type === 'back_forward') {
    document.documentElement.classList.add('vybe-transition-pending');
  }
} catch (error) {
  console.warn('VYBE could not prepare the page transition.', error);
}
</script>
